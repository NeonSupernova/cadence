name: Build desktop app

# Every push to main builds installers and attaches them to the workflow run.
# Pushing a tag like v0.2.0 publishes them, plus the signed latest.json the
# in-app updater reads, to a GitHub Release. The tag sets the app version.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
          - name: linux
            os: ubuntu-22.04
            args: ''
          - name: windows
            os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      # The tag sets the version. Updater artifacts must be signed, so builds
      # without the key (e.g. fork PRs) skip them but still produce installers.
      - name: Prepare Tauri config
        shell: bash
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e '
            const fs = require("fs"), p = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            if (process.env.TAG) c.version = process.env.TAG.replace(/^v/, "");
            if (process.env.HAS_KEY !== "true") c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

      - name: Build app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Cadence ${{ github.ref_name }}
          # Published, not draft: the updater only sees the latest published release.
          releaseDraft: false
          includeUpdaterJson: true

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: cadence-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
