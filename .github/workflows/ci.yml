name: CI

# Fast checks for pull requests and main. Installers are built only by release.yml.
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/ci.yml']
  workflow_dispatch:

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-and-frontend:
    name: Core tests, Clippy, frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/core -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (core)
        run: cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings

      - name: Test (core)
        run: cargo test --manifest-path desktop/core/Cargo.toml

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Svelte check
        working-directory: desktop
        run: bun run check

      - name: Frontend build
        working-directory: desktop
        run: bun run build

  # The app crate is mostly macOS integration code, so it is linted on macOS:
  # one native debug check instead of a universal release build plus bundling.
  app-macos:
    name: App Clippy (macOS)
    if: github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}

      # generate_context! embeds the frontend at compile time; a placeholder is
      # enough for linting, so no Bun install or frontend build is needed here.
      - name: Placeholder frontend
        run: mkdir -p desktop/build && echo '<!doctype html>' > desktop/build/index.html

      - name: Clippy (app)
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings
